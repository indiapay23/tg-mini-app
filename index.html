<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEST-TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        padding: 16px;
        color: var(--tg-theme-text-color); /* 使用Telegram主题变量 */
        background-color: var(--tg-theme-bg-color); /* 使用Telegram主题变量 */
      }
      .container {
        text-align: center;
      }
      .hidden {
        display: none;
      }
      .error {
        color: #d32f2f;
      }
    </style>
  </head>
  <body>
    <div id="app-container" class="container">
      <!-- 默认显示给普通浏览器的内容 -->
      <div id="browser-view">
        <h1 class="error">Error</h1>
        <p>Please open this page in the Telegram app via the specified bot.</p>
      </div>

      <!-- 仅在Telegram环境中显示的内容 -->
      <div id="telegram-view" class="hidden">
        <h1>Welcome!</h1>
        <p>Hello, <b id="user-name">User</b>!</p>
        <!-- <p>Hello, <b id="user-name2">User</b>!</p> -->
        <!-- <button id="close-button">关闭应用</button> -->
      </div>
    </div>

    <script>
      // 确保页面加载完成后再执行
      window.addEventListener("load", () => {
        // 检查Telegram环境是否完全就绪
        if (
          window.Telegram &&
          window.Telegram.WebApp &&
          window.Telegram.WebApp.initData
        ) {
          // --- 只有在确认环境就绪后，才进行后续操作 ---

          const tg = window.Telegram.WebApp;
          // 需要base 解码

          // 切换UI视图
          document.getElementById("telegram-view").classList.remove("hidden");
          document.getElementById("browser-view").classList.add("hidden");

          // 通知Telegram应用UI已就绪并展开窗口
          tg.ready();
          tg.expand();

          // 安全地获取并显示用户信息
          const user = tg.initDataUnsafe?.user;
          if (user) {
            document.getElementById("user-name").innerText = user.id || "朋友";

            // 生成用户名，确保长度至少6位
            let username = (user.first_name || "") + (user.last_name || "");

            // 如果用户名长度少于6位，用随机数补齐
            if (username.length < 6) {
              const randomSuffix = Math.floor(Math.random() * 1000000)
                .toString()
                .padStart(6, "0");
              username =
                username + randomSuffix.substring(0, 6 - username.length);
            }
            if (tg.initDataUnsafe?.start_param) {
              const sharedata = tg.initDataUnsafe?.start_param;
              window.location.href = `https://agent.token-in.com/#/pages/index/tlogin?userId=${user.id}&username=${username}&sharedata=${sharedata}`;
              // window.location.href = `https://azagent.agentspay.com/#/pages/index/tlogin?userId=${user.id}&username=${username}&sharedata=${sharedata}`;
            } else {
              window.location.href = `https://agent.token-in.com/#/pages/index/tlogin?userId=${user.id}&username=${username}`;
              // window.location.href = `https://azagent.agentspay.com/#/pages/index/tlogin?userId=${user.id}&username=${username}`;
            }
          }
        } else {
          console.warn(
            "Telegram WebApp not found or not ready. Running in a standard browser or launch method is incorrect."
          );
        }
      });
    </script>
  </body>
</html>
