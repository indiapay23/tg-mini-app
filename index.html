<script src="https://telegram.org/js/telegram-web-app.js"></script>

<pre id="user-info">Loading...</pre>
<button id="request-access">Request message access</button>

<script>
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  const user = tg.initDataUnsafe.user;

  document.getElementById("user-info").textContent =
    JSON.stringify(
      {
        initDataExists: Boolean(tg.initData),
        id: user?.id,
        username: user?.username,
        firstName: user?.first_name,
        lastName: user?.last_name,
        allowsWriteToPm: user?.allows_write_to_pm ?? false,
      },
      null,
      2
    );

  document
    .getElementById("request-access")
    .addEventListener("click", () => {
      tg.requestWriteAccess((allowed) => {
        alert(
          allowed
            ? "Bot messaging permission granted"
            : "Bot messaging permission denied"
        );
      });
    });
</script>
